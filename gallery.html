<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Visual Library</title>
<link rel="icon" type="image/png" href="favicon.png"><link rel="icon" type="image/x-icon" href="favicon.ico"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#0b0e16;color:#d7dbe6;font:14px/1.4 system-ui,Segoe UI,sans-serif}
  header{position:sticky;top:0;z-index:2;background:#0b0e16ee;backdrop-filter:blur(6px);
         padding:16px 24px;display:flex;gap:16px;align-items:center;border-bottom:1px solid #1d2333}
  h1{font-size:18px;margin:0;font-weight:600}
  .mark{width:34px;height:34px;image-rendering:pixelated;flex:none}
  #count{color:#7d8599}
  input{flex:1;max-width:420px;background:#141a27;border:1px solid #273048;color:inherit;
        border-radius:8px;padding:8px 12px;font:inherit}
  #tags{display:flex;flex-wrap:wrap;gap:6px;padding:12px 24px 0}
  .tag{background:#141a27;border:1px solid #273048;border-radius:999px;padding:3px 10px;cursor:pointer;color:#aab2c5;font-size:12px}
  .tag.on{background:#2b5cff;border-color:#2b5cff;color:#fff}
  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding:18px 24px 40px}
  .card{background:#111624;border:1px solid #1d2333;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:#000;cursor:pointer}
  .thumb iframe{position:absolute;left:0;top:0;width:400%;height:400%;transform:scale(.25);transform-origin:0 0;border:0;pointer-events:none}
  .thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:#56607a}
  .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .title{font-weight:600;font-size:15px}
  .desc{color:#9aa3b8;font-size:13px}
  .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
  .meta span{font-size:11px;color:#7d8599;background:#0b0e16;border-radius:4px;padding:1px 6px}
  .id{font-family:Consolas,monospace;font-size:12px;color:#6fa0ff}
  .actions{display:flex;gap:8px;padding:0 14px 14px}
  .actions a{font-size:12px;color:#aab2c5;text-decoration:none;border:1px solid #273048;border-radius:6px;padding:4px 10px}
  .actions a:hover{border-color:#2b5cff;color:#fff}
  .nav{margin-left:auto;display:flex;gap:8px;align-items:center}
  .nav a,.nav button{font:inherit;font-size:12px;color:#aab2c5;text-decoration:none;background:none;border:1px solid #273048;border-radius:6px;padding:4px 10px;cursor:pointer}
  .nav a:hover,.nav button:hover{border-color:#2b5cff;color:#fff}
</style>
</head>
<body>
<header>
  <img class="mark" src="logo-mark.png" alt=""><h1>Visual Library</h1><span id="count"></span>
  <input id="q" placeholder="Ara: isim, etiket, açıklama…" autofocus>
  <div class="nav" id="nav" hidden><a id="adminLink" href="/yonetim" hidden>Yönetim</a><button id="logout" type="button">Çıkış</button></div>
</header>
<div id="tags"></div>
<main id="grid"></main>
<script src="library.js"></script>
<script>
const lib = (window.LIBRARY || []).slice().sort((a,b)=> (b.added||'').localeCompare(a.added||''));
const grid = document.getElementById('grid'), q = document.getElementById('q');
const tagBox = document.getElementById('tags'), count = document.getElementById('count');
const active = new Set();
const allTags = [...new Set(lib.flatMap(e => e.tags || []))].sort();
allTags.forEach(t => {
  const b = document.createElement('span'); b.className = 'tag'; b.textContent = t;
  b.onclick = () => { active.has(t) ? active.delete(t) : active.add(t); b.classList.toggle('on'); render(); };
  tagBox.appendChild(b);
});
// live previews only while visible, to keep CPU low
const io = new IntersectionObserver(es => es.forEach(e => {
  const th = e.target;
  if (e.isIntersecting && !th.querySelector('iframe')){
    const f = document.createElement('iframe'); f.src = th.dataset.src; f.loading = 'lazy'; th.appendChild(f);
  } else if (!e.isIntersecting){ th.querySelector('iframe')?.remove(); }
}), {rootMargin: '100px'});
function render(){
  const s = q.value.trim().toLowerCase();
  const list = lib.filter(e => {
    const hay = [e.id, e.title, e.description, ...(e.tags||[])].join(' ').toLowerCase();
    return (!s || hay.includes(s)) && [...active].every(t => (e.tags||[]).includes(t));
  });
  count.textContent = `${list.length} / ${lib.length}`;
  grid.innerHTML = '';
  for (const e of list){
    const url = `${e.folder}/index.html`;
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `
      <div class="thumb" data-src="${url}?preview=1"><div class="ph">yükleniyor…</div></div>
      <div class="body">
        <div class="title">${e.title}</div>
        <div class="id">/visual ${e.id}</div>
        <div class="desc">${e.description || ''}</div>
        <div class="meta">${(e.tags||[]).map(t=>`<span>${t}</span>`).join('')}<span>${e.added||''}</span></div>
      </div>
      <div class="actions">
        <a href="${url}" target="_blank">Aç</a>
        <a href="${e.folder}/NOTES.md" target="_blank">Notlar</a>
        ${e.source ? `<a href="${e.source}" target="_blank">Kaynak</a>` : ''}
      </div>`;
    const th = c.querySelector('.thumb');
    th.onclick = () => window.open(url, '_blank');
    grid.appendChild(c); io.observe(th);
  }
}
q.oninput = render; render();
// Sunucuda girişliyse Çıkış (ve yönetici ise Yönetim) görünür; dosyadan açılınca sessizce gizli kalır.
fetch('/_api/me').then(r => r.ok ? r.json() : null).then(me => {
  if (!me) return;
  document.getElementById('nav').hidden = false;
  if (me.role === 'admin') document.getElementById('adminLink').hidden = false;
}).catch(() => {});
document.getElementById('logout').onclick = async () => {
  await fetch('/_api/logout', { method: 'POST' }).catch(() => {});
  location.href = '/giris';
};
</script>
</body>
</html>
