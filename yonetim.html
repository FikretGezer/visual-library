<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Library - Yonetim</title>
<link rel="icon" type="image/png" href="favicon.png"><link rel="icon" type="image/x-icon" href="favicon.ico"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0b0e16;color:#d7dbe6;font:14px/1.45 system-ui,Segoe UI,sans-serif}
  header{display:flex;gap:16px;align-items:center;padding:16px 24px;border-bottom:1px solid #1d2333}
  h1{font-size:18px;margin:0}
  h2{font-size:15px;margin:0 0 12px}
  .mark{width:34px;height:34px;image-rendering:pixelated;flex:none}
  a.home{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;background:#2b5cff;border:1px solid #2b5cff;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600}
  a.home:hover{background:#4c7dff;border-color:#4c7dff}
  main{max-width:960px;margin:0 auto;padding:20px 24px 48px;display:grid;gap:20px}
  section{background:#111624;border:1px solid #1d2333;border-radius:12px;padding:16px 18px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #1d2333;font-size:13px}
  th{color:#7d8599;font-weight:500}
  .off{opacity:.55}
  input,select{background:#141a27;border:1px solid #273048;color:inherit;border-radius:8px;padding:7px 10px;font:inherit}
  button{background:#141a27;border:1px solid #273048;color:#d7dbe6;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
  button:hover{border-color:#2b5cff}
  button.primary{background:#2b5cff;border-color:#2b5cff;color:#fff}
  button.danger:hover{border-color:#e5484d;color:#ff8a8d}
  button:disabled{opacity:.6;cursor:wait}
  form.add{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  form.add input[type=email]{flex:1;min-width:220px}
  .msg{min-height:20px;margin-top:8px;font-size:13px}
  .msg.err{color:#ff8a8d}.msg.ok{color:#6fd49a}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .muted{color:#7d8599}
</style>
</head>
<body>
<header><a class="home" href="/">&larr; Ana sayfaya dön</a><img class="mark" src="logo-mark.png" alt=""><h1>Yönetim</h1></header>
<main>
  <section>
    <h2>Güncelleme</h2>
    <div class="muted" id="status">Son güncelleme bilgisi yükleniyor…</div>
    <div style="margin-top:10px"><button class="primary" id="updateBtn" type="button">Şimdi güncelle</button></div>
    <div class="msg" id="updateMsg" role="status"></div>
  </section>
  <section>
    <h2>Kullanıcılar</h2>
    <table>
      <thead><tr><th>E-posta</th><th>Ad</th><th>Rol</th><th>Durum</th><th>Son giriş</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <form class="add" id="addForm">
      <input type="email" id="newEmail" placeholder="ornek@sirket.com" required>
      <input type="text" id="newName" placeholder="Ad (isteğe bağlı)">
      <select id="newRole"><option value="user">Kullanıcı</option><option value="admin">Yönetici</option></select>
      <button class="primary" type="submit">Ekle</button>
    </form>
    <div class="msg" id="userMsg" role="status"></div>
  </section>
</main>
<script>
const MSG = {
  INVALID_EMAIL: "Geçerli bir e-posta girin", DUPLICATE: "Bu e-posta zaten kayıtlı",
  SELF_ACTION: "Kendi hesabınızda bu işlemi yapamazsınız", LAST_ADMIN: "Son aktif yönetici değiştirilemez",
  NOT_FOUND: "Kullanıcı bulunamadı", INVALID_ROLE: "Geçersiz rol", busy: "Güncelleme zaten çalışıyor",
  forbidden: "Bu işlem için yönetici olmalısınız", origin: "İstek reddedildi",
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (iso) => (iso ? new Date(iso).toLocaleString("tr-TR") : "-");
let me = null;

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "content-type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = "/giris?next=/yonetim"; throw new Error("auth"); }
  if (!r.ok) throw new Error(MSG[data.error] || data.message || "İşlem başarısız");
  return data;
}
function say(el, text, kind) { el.textContent = text; el.className = "msg " + (kind || ""); }

async function load() {
  const users = await api("GET", "/_api/users");
  $("rows").innerHTML = users.map((u) => {
    const self = me && u.email === me.email;
    return `<tr class="${u.isActive ? "" : "off"}">
      <td>${esc(u.email)}${self ? ' <span class="muted">(siz)</span>' : ""}</td>
      <td>${esc(u.displayName)}</td>
      <td>${u.role === "admin" ? "Yönetici" : "Kullanıcı"}</td>
      <td>${u.isActive ? "Aktif" : "Pasif"}</td>
      <td>${fmt(u.lastLoginAt)}</td>
      <td><div class="row-actions">
        <button data-act="toggle" data-id="${u.id}" data-active="${u.isActive}">${u.isActive ? "Pasife al" : "Aktif et"}</button>
        <button data-act="role" data-id="${u.id}" data-role="${u.role}">${u.role === "admin" ? "Kullanıcı yap" : "Yönetici yap"}</button>
        <button class="danger" data-act="del" data-id="${u.id}" data-email="${esc(u.email)}">Sil</button>
      </div></td></tr>`;
  }).join("");
}
async function loadStatus() {
  const s = await api("GET", "/_api/update/status");
  $("status").textContent = s.at
    ? (s.error ? `Son deneme ${fmt(s.at)}: hata: ${s.error}` : `Son güncelleme ${fmt(s.at)} (${s.method}): ${s.changedFiles.length} dosya değişti`)
    : "Bu çalıştırmadan beri güncelleme yapılmadı (otomatik tur ayara göre çalışır).";
}

$("rows").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const id = b.dataset.id;
  try {
    if (b.dataset.act === "toggle") await api("PATCH", `/_api/users/${id}`, { isActive: b.dataset.active !== "true" });
    else if (b.dataset.act === "role") await api("PATCH", `/_api/users/${id}`, { role: b.dataset.role === "admin" ? "user" : "admin" });
    else if (b.dataset.act === "del") { if (!confirm(`${b.dataset.email} silinsin mi?`)) return; await api("DELETE", `/_api/users/${id}`); }
    say($("userMsg"), "Kaydedildi", "ok");
    await load();
  } catch (err) { say($("userMsg"), err.message, "err"); }
});

$("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await api("POST", "/_api/users", { email: $("newEmail").value, displayName: $("newName").value, role: $("newRole").value });
    $("addForm").reset();
    say($("userMsg"), "Kullanıcı eklendi", "ok");
    await load();
  } catch (err) { say($("userMsg"), err.message, "err"); }
});

$("updateBtn").addEventListener("click", async () => {
  const btn = $("updateBtn"); btn.disabled = true; say($("updateMsg"), "Güncelleniyor…");
  try {
    const r = await api("POST", "/_api/update", {});
    say($("updateMsg"), r.changedFiles.length ? `${r.changedFiles.length} dosya güncellendi` : "Zaten güncel", "ok");
  } catch (err) {
    say($("updateMsg"), err.message === "Failed to fetch" ? "Sunucu yeniden başlıyor, birkaç saniye sonra sayfayı yenileyin" : err.message, "err");
  }
  btn.disabled = false;
  loadStatus().catch(() => {});
});

(async () => {
  try { me = await api("GET", "/_api/me"); } catch { /* giris yonlendirmesi api() icinde */ }
  await load().catch((e) => say($("userMsg"), e.message, "err"));
  await loadStatus().catch(() => {});
})();
</script>
</body>
</html>
