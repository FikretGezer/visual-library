<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Library - Giris</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d12;color:#e8eaf0;font:15px/1.4 system-ui,Segoe UI,sans-serif}
  form{width:min(360px,92vw);padding:28px;border-radius:16px;background:#141824;border:1px solid #232a3b;display:grid;gap:14px}
  h1{margin:0 0 4px;font-size:20px}
  p.sub{margin:0;color:#8a93a8;font-size:13px}
  label{display:grid;gap:6px;font-size:13px;color:#a9b1c4}
  input{padding:11px 12px;border-radius:10px;border:1px solid #2b3347;background:#0e121b;color:inherit;font:inherit}
  input:focus{outline:2px solid #4c7dff;border-color:transparent}
  button{padding:11px;border:0;border-radius:10px;background:#4c7dff;color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .err{min-height:18px;color:#ff7a7a;font-size:13px}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div><h1>Visual Library</h1><p class="sub">Sirket hesabinizla giris yapin</p></div>
  <label>E-posta<input id="email" name="email" type="email" autocomplete="username" required autofocus></label>
  <label>Parola<input id="password" name="password" type="password" autocomplete="current-password" required></label>
  <div class="err" id="err" role="alert"></div>
  <button id="btn" type="submit">Giris yap</button>
</form>
<script>
const MSG = { invalid: "Giris basarisiz", unavailable: "Kimlik servisine ulasilamiyor", locked: "Cok fazla deneme. Biraz sonra tekrar deneyin" };
const f = document.getElementById("f"), err = document.getElementById("err"), btn = document.getElementById("btn");
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.textContent = ""; btn.disabled = true;
  try {
    const next = new URLSearchParams(location.search).get("next") || "/";
    const r = await fetch("/_api/login", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ email: f.email.value, password: f.password.value, next }),
    });
    const body = await r.json().catch(() => ({}));
    if (r.ok) { location.href = body.next || "/"; return; }
    err.textContent = MSG[body.error] || "Giris basarisiz";
  } catch { err.textContent = "Sunucuya ulasilamiyor"; }
  btn.disabled = false;
});
</script>
</body>
</html>
