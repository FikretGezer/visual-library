<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Autopilot Slider</title>
<style>
  :root {
    /* JS bu değişkenleri kaydırma oranına göre sürekli günceller */
    --bg1: #f2f3f6; --bg2: #d7d9de;
    --rimA: #ffffff; --rimB: #cfd3dc;
    --shadow: 0.22;
    --status: #3ddc84;
    --lens-w: 56px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 45%, var(--bg1) 0%, var(--bg2) 100%);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  header {
    height: 46px; flex: none;
    background: linear-gradient(180deg, #151822, #0e1017);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
    position: relative; z-index: 2;
  }
  header h1 { margin: 0; font-size: 14px; font-weight: 700; color: #fff; letter-spacing: .01em; }
  #status {
    margin-top: 2px; font: 700 10px/1 "Cascadia Mono", Consolas, monospace;
    letter-spacing: .14em; text-transform: uppercase; color: var(--status);
    text-shadow: 0 0 8px color-mix(in srgb, var(--status) 55%, transparent);
  }
  main { flex: 1; display: grid; place-items: center; padding: 0 4vw; }
  .widget { width: min(92vw, 780px); position: relative; user-select: none; -webkit-user-select: none; }

  .track {
    position: relative; width: 100%;
    padding: 10px; border-radius: 999px;
    background: linear-gradient(180deg, var(--rimA) 0%, var(--rimB) 100%);
    box-shadow:
      0 26px 50px -12px rgba(0,0,0,var(--shadow)),
      0 6px 14px rgba(0,0,0,calc(var(--shadow) * .6)),
      inset 0 2px 3px rgba(255,255,255,.85),
      inset 0 -4px 8px rgba(0,0,0,.14);
    cursor: grab; touch-action: none; outline: none;
  }
  .track:active { cursor: grabbing; }
  .track:focus-visible { box-shadow: 0 0 0 3px rgba(61,220,132,.7), 0 26px 50px -12px rgba(0,0,0,.3); }

  .scene-wrap {
    position: relative; border-radius: 999px; overflow: hidden;
    background: #111;
    aspect-ratio: 256 / 48;
  }
  .scene-wrap canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .scene-wrap::after { /* iç gölge: sahne oyuk gibi dursun */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 5px 14px rgba(0,0,0,.4), inset 0 -3px 8px rgba(0,0,0,.22), inset 0 0 0 1px rgba(0,0,0,.25);
  }

  /* ---- Sıvı cam lens ---- */
  .lens {
    position: absolute; top: 50%; left: 0; z-index: 5;
    width: var(--lens-w); pointer-events: none;
    transform: translate(-50%, -50%);
    will-change: left, transform;
  }
  .lens-body {
    position: relative; width: 100%; height: 100%;
    border-radius: 999px; overflow: hidden;
    background: linear-gradient(100deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.06) 38%, rgba(255,255,255,.04) 62%, rgba(255,255,255,.3) 100%);
    border: 1.5px solid rgba(255,255,255,.8);
    box-shadow:
      inset 3px 0 10px rgba(255,255,255,.55),
      inset -3px 0 10px rgba(255,255,255,.3),
      inset 0 0 22px rgba(255,255,255,.18),
      0 12px 26px rgba(0,0,0,.28);
    backdrop-filter: blur(1.5px) saturate(1.35) brightness(1.06);
    -webkit-backdrop-filter: blur(1.5px) saturate(1.35) brightness(1.06);
  }
  .lens-body canvas { position: absolute; left: 0; width: 100%; image-rendering: pixelated; }
  .lens-body::before { /* sol dikey parlama */
    content: ""; position: absolute; left: 9%; top: 12%; bottom: 12%; width: 14%;
    border-radius: 999px; z-index: 2;
    background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.15) 55%, rgba(255,255,255,.5));
    filter: blur(1px); opacity: .75;
  }
  .lens-body::after { /* üst yay yansıması */
    content: ""; position: absolute; left: 22%; right: 22%; top: 3%; height: 9%;
    border-radius: 999px; z-index: 2;
    background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,0));
    opacity: .7;
  }

  .hint {
    position: absolute; left: 0; right: 0; bottom: -34px; text-align: center;
    font-size: 12px; letter-spacing: .06em; color: color-mix(in srgb, var(--status) 0%, #8a90a0);
    transition: opacity .6s; pointer-events: none;
  }
  .hint.gone { opacity: 0; }

  #mute {
    position: fixed; right: 14px; bottom: 14px; width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25); background: rgba(20,22,30,.7); color: #fff;
    font-size: 16px; cursor: pointer; backdrop-filter: blur(6px);
  }
  #mute:hover { background: rgba(20,22,30,.9); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
  <header>
    <h1>AI Autopilot Slider</h1>
    <div id="status">100% FULL AUTOPILOT</div>
  </header>

  <main>
    <div class="widget">
      <div class="track" id="track" role="slider" tabindex="0"
           aria-label="Manuel kaos ile tam otopilot arasında kaydır"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
        <div class="scene-wrap" id="sceneWrap"><canvas id="scene" width="256" height="48"></canvas></div>
        <div class="lens" id="lens" aria-hidden="true">
          <div class="lens-body"><canvas id="lensCanvas"></canvas></div>
        </div>
      </div>
      <div class="hint" id="hint">Bir yere tıkla ya da lensi sürükle · ← → tuşları da çalışır</div>
    </div>
  </main>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <button id="mute" title="Sesi aç/kapat" aria-label="Sesi aç/kapat">🔊</button>

<script src="../back-button.js"></script>
<script>
(() => {
  /* ===================== Piksel sahne ===================== */
  const GW = 256, GH = 48;
  const mk = () => { const c = document.createElement("canvas"); c.width = GW; c.height = GH; return c; };
  const cAuto = mk(), cChaos = mk();
  const gAuto = cAuto.getContext("2d"), gChaos = cChaos.getContext("2d");

  const R = (g, x, y, w, h, c, a) => {
    if (a !== undefined) g.globalAlpha = a;
    g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h);
    if (a !== undefined) g.globalAlpha = 1;
  };
  const hash = (x, y) => {
    let h = (x * 374761393 + y * 668265263) | 0;
    h = (h ^ (h >>> 13)) * 1274126177 | 0;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  };

  const PAL = {
    auto:  { wall:"#f3e8cf", wallTop:"#e6d8b6", base:"#c7a470", fA:"#cf9558", fB:"#bf8548", seam:"#9c6a38",
             winFrame:"#ffffff", desk:"#9a6a45", deskTop:"#b78358", chair:"#4d6fa8", bezel:"#2b3345",
             pot:"#c0613e", leafA:"#3ecf7a", leafB:"#2fb565", leafC:"#58e08e", lampPole:"#7a6247",
             couch:"#3aa89a", couchD:"#2c8a7e", cab:"#9a6a45", cabD:"#7d5436" },
    chaos: { wall:"#2b2739", wallTop:"#221f2f", base:"#1b1827", fA:"#2a2233", fB:"#241d2c", seam:"#1a1421",
             winFrame:"#3b3652", desk:"#3b2c3a", deskTop:"#4a3848", chair:"#2d2a40", bezel:"#14161f",
             pot:"#4a2c34", leafA:"#1f5a54", leafB:"#194a47", leafC:"#27726a", lampPole:"#3a3448",
             couch:"#463a66", couchD:"#372d52", cab:"#3a2a33", cabD:"#2c2028" }
  };
  const STARS = [[26,11],[31,14],[35,10],[42,18],[47,12],[28,20],[50,21],[33,19],[45,9],[38,13]];
  const SKYLINE = [[25,17,4,8,"#6fa2cf"],[30,14,4,11,"#5f93c2"],[35,18,5,7,"#7ab0db"],[41,15,4,10,"#6fa2cf"],[46,18,5,7,"#5f93c2"]];
  const NOTES = [[68,5,"#ff6b5e"],[75,7,"#ffb347"],[82,4,"#ffd95e"],[89,7,"#ff8fa0"],[96,5,"#ffb347"],[102,8,"#ff6b5e"],[72,11,"#ffd95e"],[93,11,"#ff6b5e"]];

  function drawRoom(g, auto, t) {
    const P = auto ? PAL.auto : PAL.chaos;

    // duvar + zemin
    R(g,0,0,GW,36,P.wall);
    R(g,0,0,GW,3,P.wallTop);
    R(g,0,34,GW,2,P.base);
    R(g,0,36,GW,12,P.fA);
    for (let y = 36; y < GH; y += 4) {
      R(g,0,y,GW,2,P.fB);
      for (let x = 0; x < GW; x += 2) if (hash(x >> 3, y) > 0.78 && (x & 7) === 0) R(g,x,y,1,4,P.seam);
    }

    // pencere
    R(g,22,6,34,20,P.winFrame);
    if (auto) {
      R(g,24,8,30,16,"#9bd7ff");
      R(g,24,8,30,5,"#b5e2ff");
      SKYLINE.forEach(([x,y,w,h,c]) => { R(g,x+1,y+6,w,h,c); R(g,x+2,y+8,1,1,"#d6efff"); R(g,x+2,y+11,1,1,"#d6efff"); });
      R(g,45,10,5,5,"#ffe566"); R(g,46,9,3,7,"#ffe566"); R(g,44,11,7,3,"#ffe566");
      const cx = 27 + ((t * 1.2) % 22);
      R(g,cx,11,8,2,"#fff"); R(g,cx+2,10,4,1,"#fff");
    } else {
      R(g,24,8,30,16,"#0a0f2a");
      STARS.forEach(([x,y],i) => R(g,x,y,1,1,"#fff8d8", 0.35 + 0.65*Math.abs(Math.sin(t*1.7 + i*1.9))));
      R(g,44,11,4,4,"#e9e6ff"); R(g,46,10,3,5,"#0a0f2a"); // hilal
    }
    R(g,38,8,2,16,P.winFrame); R(g,24,15,30,2,P.winFrame);
    R(g,20,26,38,2,P.base);

    // bitki
    R(g,9,22,2,9,P.leafB);
    R(g,5,20,5,3,P.leafA); R(g,10,18,5,3,P.leafC); R(g,6,25,4,3,P.leafB); R(g,11,23,4,3,P.leafA);
    R(g,6,30,10,7,P.pot); R(g,5,29,12,2,auto ? "#d9794f" : "#5b3a42");

    // masa üstü duvar: yapışkan notlar (kaos) / onay rozeti (otopilot)
    if (auto) {
      R(g,84,5,10,9,"#2fb565"); R(g,85,6,8,7,"#3ecf7a");
      R(g,86,9,2,2,"#fff"); R(g,88,10,2,2,"#fff"); R(g,90,8,2,3,"#fff");
      R(g,97,6,2,2,"#ffe566", 0.5 + 0.5*Math.sin(t*3)); R(g,76,7,2,2,"#ffe566", 0.5 + 0.5*Math.sin(t*3+2));
    } else {
      NOTES.forEach(([x,y,c],i) => {
        const flick = i % 3 === 0 ? 0.65 + 0.35*Math.abs(Math.sin(t*2.3 + i)) : 1;
        R(g,x,y,6,5,c,flick); R(g,x+1,y+1,4,1,"rgba(0,0,0,.25)");
      });
      R(g,60,3,50,16,"#ff4d4d", 0.05 + 0.03*Math.sin(t*5));
    }

    // masa + sandalye
    R(g,60,27,52,3,P.deskTop); R(g,60,30,52,1,P.desk);
    R(g,62,31,3,5,P.desk); R(g,107,31,3,5,P.desk); R(g,80,31,16,4,P.desk);
    R(g,80,32,6,2,P.deskTop);
    // monitörler
    for (let i = 0; i < 2; i++) {
      const mx = i ? 85 : 66, mw = 14, my = 16;
      R(g,mx,my,mw,10,P.bezel); R(g,mx+6,26,2,1,P.bezel); R(g,mx+3,26,8,1,P.bezel);
      if (auto) {
        R(g,mx+1,my+1,mw-2,8,"#0c1d2b");
        if (i === 0) {
          for (let b = 0; b < 4; b++) {
            const h = 2 + Math.round((Math.sin(t*1.6 + b*1.3) + 1) * 1.8);
            R(g,mx+3+b*2,my+8-h,1,h,"#3ddc84");
          }
          R(g,mx+2,my+2,6,1,"#72d8ff");
        } else {
          R(g,mx+2,my+2,8,1,"#3ddc84"); R(g,mx+2,my+4,5,1,"#72d8ff"); R(g,mx+2,my+6,9,1,"#3ddc84");
          if (((t*2)|0) % 2) R(g,mx+11,my+6,1,2,"#fff");
        }
      } else {
        R(g,mx+1,my+1,mw-2,8,"#1a0d14");
        const fl = (0.6 + 0.4*Math.abs(Math.sin(t*4 + i*2)));
        R(g,mx+2,my+2,8,1,"#ff5d5d",fl); R(g,mx+2,my+4,10,1,"#ff9f43",fl); R(g,mx+2,my+6,5,1,"#ff5d5d");
        if (((t*3)|0) % 2) R(g,mx+8,my+6,1,2,"#ffd95e");
      }
    }
    // klavye / kupalar
    R(g,76,26,12,1,auto ? "#dfe6f3" : "#58546b");
    if (!auto) { R(g,105,24,3,3,"#e8e2f0"); R(g,100,25,3,2,"#e8e2f0"); R(g,106,21,1,2,"#fff",.5 + .4*Math.sin(t*3)); }

    // sandalye + kişi (yalnızca kaos; otopilotta kişi koltukta)
    if (!auto) {
      R(g,88,22,6,13,P.chair); R(g,86,31,10,2,P.chair); R(g,89,34,4,2,P.chair);
      // kişi
      R(g,82,19,5,5,"#f0b48a"); R(g,82,18,5,2,"#2d211c"); R(g,81,19,1,3,"#2d211c");
      R(g,80,24,8,8,"#c0463a"); R(g,86,26,6,2,"#c0463a"); R(g,90,27,2,2,"#f0b48a");
      R(g,79,30,8,2,"#3a3a58"); R(g,79,32,2,4,"#3a3a58");
      if (((t*2.5)|0) % 2) R(g,83,13,1,3,"#ff5d5d"), R(g,83,17,1,1,"#ff5d5d");
    }

    // duvar paneli
    R(g,118,7,44,13,auto ? "#18202e" : "#1d1a29");
    if (auto) {
      R(g,119,8,42,11,"#0b121c");
      for (let i = 0; i < 6; i++) R(g,122+i*7,17,5,1,"#16324a");
      const pts = [[122,16],[128,15],[134,16],[140,13],[146,12],[152,10],[158,9]];
      g.strokeStyle = "#3ddc84"; g.lineWidth = 1;
      g.beginPath(); pts.forEach(([x,y],i) => i ? g.lineTo(x+.5,y+.5) : g.moveTo(x+.5,y+.5)); g.stroke();
      pts.forEach(([x,y]) => R(g,x,y,1,1,"#a8ffd0"));
      const k = Math.floor((t*3) % pts.length); R(g,pts[k][0]-1,pts[k][1]-1,3,3,"#fff",.55);
    } else {
      R(g,119,8,42,11,"#12101a");
      R(g,124,11,32,1,"#2c2840"); R(g,124,14,32,1,"#2c2840"); R(g,124,17,32,1,"#2c2840");
    }

    // halı karoları (otopilot)
    if (auto) ["#7dd3fc","#86efac","#fde68a","#f9a8d4","#c4b5fd","#fca5a5"].forEach((c,i) => R(g,122+i*8,40,7,2,c));

    // robotlar
    for (let i = 0; i < 3; i++) {
      const bx = 126 + i*15;
      const on = auto;
      const by = on ? 20 + Math.round(Math.sin(t*2.2 + i*1.7)*1.2) : 27;
      const body = on ? "#f6f8fc" : "#4a4f66", shade = on ? "#c9d2e4" : "#383c50";
      if (on) R(g,bx-1,37,10,2,"rgba(0,0,0,.18)");
      R(g,bx+3,by-3,2,3,shade); R(g,bx+3,by-4,2,1,on ? "#ff8fd0" : "#5a5f78");
      R(g,bx,by,8,6,body); R(g,bx,by+5,8,1,shade);
      R(g,bx+1,by+6,6,5,body); R(g,bx+1,by+10,6,1,shade);
      R(g,bx+1,by+11,2,2,shade); R(g,bx+5,by+11,2,2,shade);
      const blink = (Math.sin(t*1.3 + i*2.1) > 0.93);
      if (on) { if (!blink) { R(g,bx+2,by+2,1,2,"#27c4ff"); R(g,bx+5,by+2,1,2,"#27c4ff"); } else { R(g,bx+2,by+3,1,1,"#27c4ff"); R(g,bx+5,by+3,1,1,"#27c4ff"); }
              R(g,bx+2,by+13+(t*6|0)%2,4,1,"#72d8ff",.5); }
      else { R(g,bx+2,by+3,2,1,"#6b708c"); R(g,bx+5,by+3,2,1,"#6b708c");
             if (i === 1) { const zy = by - 9 - ((t*5)%4|0); R(g,bx+7,zy,3,1,"#9fb4ff"); R(g,bx+8,zy+1,1,1,"#9fb4ff"); R(g,bx+7,zy+2,3,1,"#9fb4ff"); } }
    }

    // lamba
    R(g,177,18,2,18,P.lampPole); R(g,174,35,8,2,P.lampPole);
    for (let r = 0; r < 6; r++) R(g,176-r,12+r,4+r*2,1, auto ? "#ffd770" : "#4a4560");
    if (auto) { R(g,168,18,20,18,"#ffe9a8",.1); R(g,171,18,14,18,"#ffe9a8",.1); R(g,175,12,6,2,"#fff3c4"); }

    // koltuk
    R(g,192,21,36,10,P.couchD); R(g,190,26,6,10,P.couch); R(g,224,26,6,10,P.couch);
    R(g,196,29,28,7,P.couch); R(g,196,29,28,1,auto ? "#58c9ba" : "#5a4d80");
    R(g,192,36,3,2,P.cabD); R(g,226,36,3,2,P.cabD);
    if (auto) { // koltukta rahat kişi + laptop
      R(g,205,17,5,5,"#f0b48a"); R(g,205,16,5,2,"#3a2a20");
      R(g,204,22,8,8,"#e5eaf5"); R(g,208,24,6,2,"#e5eaf5");
      R(g,203,29,10,2,"#3b4a78"); R(g,212,31,3,5,"#3b4a78");
      R(g,213,25,4,5,"#2a2f40"); R(g,214,26,2,3,"#8fd0ff"); R(g,209,28,8,1,"#cbd3e6");
      const ny = 12 - ((t*4)%6|0);
      R(g,233,ny+4,2,2,"#ff8fd0",.9); R(g,235,ny+1,1,5,"#ff8fd0",.9);
      R(g,222,ny+14,2,2,"#ffe566",.8);
    } else {
      R(g,198,26,6,5,"#5a4a80"); R(g,214,27,6,4,"#5a4a80");
    }

    // dolap + kırmızı bot
    R(g,236,26,12,10,P.cab); R(g,236,26,12,2,P.cabD); R(g,238,29,8,3,P.cabD); R(g,241,30,2,1,"#d8c3a0");
    if (auto) {
      R(g,238,17,8,9,"#d6453d"); R(g,239,18,6,7,"#e85a50");
      R(g,240,19,4,3,"#ffb3da"); if (((t*2)|0) % 3) R(g,241,20,2,1,"#fff");
      R(g,241,15,2,2,"#d6453d"); R(g,241,14,2,1,"#ffe566");
    } else {
      R(g,242,28,1,1,"#ff5d5d", 0.4 + 0.6*Math.abs(Math.sin(t*2.6)));
      R(g,239,22,6,4,"#3c2f45"); R(g,240,23,4,2,"#251c2e");
    }

    // gece: hafif karartma + ekran parıltısı
    if (!auto) {
      R(g,0,0,GW,GH,"#0a0820",.12);
      R(g,62,15,46,14,"#ff5d5d",.05);
    }
  }

  /* ===================== DOM / geometri ===================== */
  const $ = (id) => document.getElementById(id);
  const track = $("track"), lens = $("lens"), scene = $("scene"), sceneWrap = $("sceneWrap");
  const lensCanvas = $("lensCanvas"), statusEl = $("status"), live = $("live"), hint = $("hint"), muteBtn = $("mute");
  const sg = scene.getContext("2d");
  const lg = lensCanvas.getContext("2d");
  sg.imageSmoothingEnabled = false; lg.imageSmoothingEnabled = false;

  const PAD = 10, MAG = 1.35;
  let geo = {};
  function layout() {
    const lensW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lens-w")) || 56;
    const w = track.clientWidth, h = track.clientHeight;
    const sceneW = sceneWrap.clientWidth, sceneH = sceneWrap.clientHeight;
    const lensH = h + 34;
    lens.style.height = lensH + "px";
    const dpr = window.devicePixelRatio || 1;
    lensCanvas.style.top = ((lensH - sceneH) / 2) + "px";
    lensCanvas.style.height = sceneH + "px";
    lensCanvas.width = Math.round(lensW * dpr); lensCanvas.height = Math.round(sceneH * dpr);
    lg.imageSmoothingEnabled = false;
    geo = { lensW, w, h, sceneW, sceneH, lensH, min: lensW / 2 + 4, max: w - lensW / 2 - 4 };
  }

  /* ===================== Tema (renk karışımı) ===================== */
  const hex = (s) => [1,3,5].map(i => parseInt(s.slice(i, i+2), 16));
  const mix = (a, b, t) => { const A = hex(a), B = hex(b); return "#" + A.map((v,i) => Math.round(v + (B[i]-v)*t).toString(16).padStart(2,"0")).join(""); };
  const THEME = {
    bg1:    ["#26222f", "#f2f3f6"], bg2:  ["#110f17", "#d7d9de"],
    rimA:   ["#4c485b", "#ffffff"], rimB: ["#1d1a26", "#cfd3dc"],
    status: ["#ff5d5d", "#3ddc84"]
  };
  const root = document.documentElement.style;
  function applyTheme(p) {
    for (const k in THEME) root.setProperty("--" + k, mix(THEME[k][0], THEME[k][1], p));
    root.setProperty("--shadow", (0.55 + (0.22 - 0.55) * p).toFixed(3));
  }

  /* ===================== Ses ===================== */
  let ac = null, master, noiseGain, noiseFilter, muted = false;
  function initAudio() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    ac = new C();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(ac.destination);
    const buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    noiseFilter = ac.createBiquadFilter(); noiseFilter.type = "bandpass"; noiseFilter.Q.value = 2.2;
    noiseGain = ac.createGain(); noiseGain.gain.value = 0;
    src.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(master); src.start();
  }
  function tone(freq, dur, type, vol, delay = 0, endFreq) {
    if (!ac) return;
    const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  const chimeUp   = () => { tone(523, .22, "sine", .09); tone(659, .22, "sine", .08, .07); tone(784, .35, "sine", .08, .14); };
  const glitchDown = () => { tone(220, .18, "sawtooth", .045, 0, 90); tone(160, .14, "square", .03, .05, 70); };
  muteBtn.addEventListener("click", (e) => {
    e.stopPropagation(); muted = !muted; muteBtn.textContent = muted ? "🔇" : "🔊";
    initAudio(); if (master) master.gain.setTargetAtTime(muted ? 0 : 0.9, ac.currentTime, 0.02);
  });

  /* ===================== Kaydırma durumu ===================== */
  let target = 1, pos = 1, prevPos = 1, vel = 0, dragging = false, started = false, rate = 16;
  let lastTick = -1, lastSide = 1, lastLabel = "";

  const sx = (clientX) => {
    const r = track.getBoundingClientRect();
    const x = Math.min(geo.max, Math.max(geo.min, clientX - r.left));
    return (x - geo.min) / (geo.max - geo.min);
  };
  const begin = () => { if (!started) { started = true; hint.classList.add("gone"); } initAudio(); };

  track.addEventListener("pointerdown", (e) => {
    begin();
    const x = e.clientX - track.getBoundingClientRect().left;
    const lensX = geo.min + pos * (geo.max - geo.min);
    if (Math.abs(x - lensX) <= geo.lensW / 2 + 6) {   // lense bastı: sürükle
      dragging = true; rate = 16; track.setPointerCapture(e.pointerId); target = sx(e.clientX);
    } else {                                           // boşluğa tıkladı: yumuşakça gece/gündüze git
      rate = 4; target = x < lensX ? 0 : 1;
    }
  });
  track.addEventListener("pointermove", (e) => { if (dragging) target = sx(e.clientX); });
  const end = (e) => { dragging = false; try { track.releasePointerCapture(e.pointerId); } catch (_) {} };
  track.addEventListener("pointerup", end); track.addEventListener("pointercancel", end);
  track.addEventListener("keydown", (e) => {
    begin(); rate = 16;
    const k = e.key;
    if (k === "ArrowLeft" || k === "ArrowDown") target -= 0.05;
    else if (k === "ArrowRight" || k === "ArrowUp") target += 0.05;
    else if (k === "Home") target = 0; else if (k === "End") target = 1; else return;
    target = Math.min(1, Math.max(0, target)); e.preventDefault();
  });
  window.addEventListener("resize", layout);

  /* ===================== Çizim döngüsü ===================== */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;

    // yay benzeri takip: lens parmağı sıvı gibi izler
    pos += (target - pos) * (1 - Math.exp(-dt * rate));
    vel = dt > 0 ? (pos - prevPos) / dt : 0; prevPos = pos;

    // sahneler
    drawRoom(gAuto, true, t); drawRoom(gChaos, false, t);

    // lens ve ayrım çizgisi
    const lensX = geo.min + pos * (geo.max - geo.min);
    lens.style.left = lensX + "px";
    const stretch = Math.min(0.28, Math.abs(vel) * 0.09);
    lens.style.transform = `translate(-50%, -50%) scale(${1 + stretch}, ${1 - stretch * 0.28})`;

    const edge = pos * GW; // otopilot (aydınlık) katman ayrım çizgisinin solunda
    sg.clearRect(0, 0, GW, GH);
    sg.drawImage(cChaos, 0, 0);
    if (edge > 0) sg.drawImage(cAuto, 0, 0, edge, GH, 0, 0, edge, GH);
    R(sg, edge - 1, 0, 1, GH, "rgba(255,255,255,.25)");

    // lensin içinde büyütülmüş görüntü
    const scale = geo.sceneW / GW;
    const cxGrid = (lensX - PAD) / geo.sceneW * GW;
    const sw = geo.lensW / scale / MAG, sh = GH / MAG;
    lg.clearRect(0, 0, lensCanvas.width, lensCanvas.height);
    lg.drawImage(scene, cxGrid - sw / 2, (GH - sh) / 2, sw, sh, 0, 0, lensCanvas.width, lensCanvas.height);

    // tema + etiket
    applyTheme(pos);
    const pct = Math.round(pos * 100);
    const label = pct >= 50 ? `${pct}% FULL AUTOPILOT` : `${String(pct).padStart(2, "0")} MANUAL CHAOS`;
    if (label !== lastLabel) {
      statusEl.textContent = label; lastLabel = label;
      track.setAttribute("aria-valuenow", String(pct));
      if (pct % 10 === 0) live.textContent = label;
    }

    // ses
    if (ac) {
      const now2 = ac.currentTime;
      noiseGain.gain.setTargetAtTime(Math.min(0.1, Math.abs(vel) * 0.07), now2, 0.03);
      noiseFilter.frequency.setTargetAtTime(450 + pos * 2400, now2, 0.03);
      const idx = Math.floor(pos * 24);
      if (idx !== lastTick && Math.abs(vel) > 0.02) { tone(260 + pos * 760, 0.045, "triangle", 0.035); }
      lastTick = idx;
      const side = pos >= 0.5 ? 1 : 0;
      if (side !== lastSide && started) { side ? chimeUp() : glitchDown(); }
      lastSide = side;
    } else lastSide = pos >= 0.5 ? 1 : 0;

    requestAnimationFrame(frame);
  }

  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
